<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Glossary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="common-placeholder"></div>
  
    <script>
      fetch('/assets/commons/commonNavFooter.html')
        .then(res => res.text())
        .then(text => {
          let oldelem = document.querySelector("div[id='common-placeholder']");
          let newelem = document.createElement("div");
          newelem.innerHTML = text;
          oldelem.parentNode.replaceChild(newelem, oldelem);
        })
    </script>
  <main class="container section">
    <h1>Glossary</h1>
    <input type="search" id="glossarySearch" placeholder="Search terms…" aria-label="Search glossary">
    <div id="glossary"></div>
  </main>
  <script src="/assets/js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/assets/js/search.js"></script>
  <script src="/assets/js/render-glossary.js"></script>
  <script src="/assets/js/main.js"></script>
  <div id="common-placeholder"></div>

  <script>
    fetch('/assets/commons/commonNavFooter.html')
      .then(res => res.text())
      .then(text => {
        let oldelem = document.querySelector("div[id='common-placeholder']");
        let newelem = document.createElement("div");
        newelem.innerHTML = text;
        oldelem.parentNode.replaceChild(newelem, oldelem);
      })
  </script>
</body>
</html>
