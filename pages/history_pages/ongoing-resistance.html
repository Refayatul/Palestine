<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ongoing Resistance | Free Palestine</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="common-placeholder"></div>
    
        <script>
            fetch('/assets/commons/commonNavFooter.html')
                .then(res => res.text())
                .then(text => {
                    let oldelem = document.querySelector("div[id='common-placeholder']");
                    let newelem = document.createElement("div");
                    newelem.innerHTML = text;
                    oldelem.parentNode.replaceChild(newelem, oldelem);
                })
        </script>

    <!-- Main Content -->
    <div class="container">
        <h1>Ongoing Resistance (2025)</h1>
        <p>Despite 76+ years of ethnic cleansing, Palestinians continue their struggle for liberation and return. This resistance takes many forms, including peaceful protests, civil disobedience, cultural preservation, and armed struggle.</p>
    </div>

    <div id="common-placeholder"></div>

    <script>
        fetch('/assets/commons/commonNavFooter.html')
            .then(res => res.text())
            .then(text => {
                let oldelem = document.querySelector("div[id='common-placeholder']");
                let newelem = document.createElement("div");
                newelem.innerHTML = text;
                oldelem.parentNode.replaceChild(newelem, oldelem);
            })
    </script>
</body>
</html>
