<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Country Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="common-placeholder"></div>
  
    <script>
      fetch('/assets/commons/common.html')
        .then(res => res.text())
        .then(text => {
          let oldelem = document.querySelector("div[id='common-placeholder']");
          let newelem = document.createElement("div");
          newelem.innerHTML = text;
          oldelem.parentNode.replaceChild(newelem, oldelem);
        })
    </script>
  <main class="container section" id="country"></main>
  <script src="/assets/js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/assets/js/search.js"></script>
  <script src="/assets/js/render-country.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
