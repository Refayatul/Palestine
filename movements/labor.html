<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palestinian Labor Movement - Palestine</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="common-placeholder"></div>
    
        <script>
            fetch('/assets/commons/commonNavFooter.html')
                .then(res => res.text())
                .then(text => {
                    let oldelem = document.querySelector("div[id='common-placeholder']");
                    let newelem = document.createElement("div");
                    newelem.innerHTML = text;
                    oldelem.parentNode.replaceChild(newelem, oldelem);
                })
        </script>
    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Palestinian Labor Movement</h1>
                <p>Information and resources about the Palestinian labor movement.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <h2>Overview</h2>
                <p>This section will provide an overview of the Palestinian labor movement, its history, goals, and
                    activities.</p>
            </div>
        </section>
    </main>
    <div id="common-placeholder"></div>

    <script>
        fetch('/assets/commons/commonNavFooter.html')
            .then(res => res.text())
            .then(text => {
                let oldelem = document.querySelector("div[id='common-placeholder']");
                let newelem = document.createElement("div");
                newelem.innerHTML = text;
                oldelem.parentNode.replaceChild(newelem, oldelem);
            })
    </script>
</body>

</html>
