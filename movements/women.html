<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palestinian Women's Movement - Palestine</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
    <script src="/assets/js/render-movements.js" defer></script>
</head>

<body>
    <div id="common-placeholder"></div>
    
        <script>
            fetch('/assets/commons/commonNavFooter.html')
                .then(res => res.text())
                .then(text => {
                    let oldelem = document.querySelector("div[id='common-placeholder']");
                    let newelem = document.createElement("div");
                    newelem.innerHTML = text;
                    oldelem.parentNode.replaceChild(newelem, oldelem);
                })
        </script>
    <main>
        <section class="hero">
            <div class="hero-content">
                <h1 id="movement-title">Palestinian Women's Movement</h1>
                <p id="movement-intro">Loading introduction...</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <h2>Profiles</h2>
                <div id="profiles-grid" class="grid three">
                    <!-- Profiles will be rendered here by JavaScript -->
                </div>
            </div>
        </section>

        <section class="section section-alt">
            <div class="container">
                <h2>Organizations</h2>
                <div id="organizations-grid" class="grid two">
                    <!-- Organizations will be rendered here by JavaScript -->
                </div>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <h2>Actions & Campaigns</h2>
                <div id="actions-grid" class="grid two">
                    <!-- Actions will be rendered here by JavaScript -->
                </div>
            </div>
        </section>

        <section class="section section-alt">
            <div class="container">
                <h3>Sources</h3>
                <ul id="movement-sources" class="source-list">
                    <!-- Sources will be rendered here by JavaScript -->
                </ul>
            </div>
        </section>
    </main>
    <div id="common-placeholder"></div>

    <script>
        fetch('/assets/commons/commonNavFooter.html')
            .then(res => res.text())
            .then(text => {
                let oldelem = document.querySelector("div[id='common-placeholder']");
                let newelem = document.createElement("div");
                newelem.innerHTML = text;
                oldelem.parentNode.replaceChild(newelem, oldelem);
            })
    </script>
</body>

</html>
