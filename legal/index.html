        // Function to render legal documents
        function renderLegalDocuments(documents) {
            const grid = document.getElementById('legal-documents-grid');
            grid.innerHTML = '';

            if (documents.length === 0) {
                grid.innerHTML = '<div class="no-results">No documents found matching your criteria.</div>';
                return;
            }

            documents.forEach(doc => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.innerHTML = `
                    <div class="legal-card-header">
                        <span class="legal-type ${doc.type.toLowerCase()}">${doc.type}</span>
                        <span class="legal-year">${doc.year}</span>
                    </div>
                    <h3 class="legal-title">${doc.title}</h3>
                    <div class="legal-topic ${doc.topic}">${formatTopic(doc.topic)}</div>
                    <p class="legal-summary">${doc.summary}</p>
                    <div class="legal-tags">
                        ${doc.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="legal-actions">
                        <a href="${doc.link}" target="_blank" class="btn-small">View Document</a>
                        <button class="btn-small secondary" onclick="showFullText(${doc.id})">Details</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('results-count').textContent = documents.length;
        }

        // Format topic for display
        function formatTopic(topic) {
            const topicMap = {
                'occupation': 'Occupation',
                'apartheid': 'Apartheid',
                'war-crimes': 'War Crimes',
                'genocide': 'Genocide',
                'settlements': 'Settlements',
                'refugees': 'Refugees',
                'human-rights': 'Human Rights',
                'self-determination': 'Self-Determination',
                'peace-process': 'Peace Process',
                'statehood': 'Statehood',
                'cultural-rights': 'Cultural Rights'
            };
            return topicMap[topic] || topic;
        }

        // Show full text modal
        function showFullText(id) {
            const doc = legalDocuments.find(d => d.id === id);
            if (!doc) return;

            // Create modal
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>${doc.title}</h2>
                        <button class="close-modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="modal-meta">
                            <span class="legal-type ${doc.type.toLowerCase()}">${doc.type}</span>
                            <span class="legal-year">${doc.year}</span>
                            <span class="legal-topic ${doc.topic}">${formatTopic(doc.topic)}</span>
                        </div>
                        <div class="modal-summary">
                            <h3>Summary</h3>
                            <p>${doc.summary}</p>
                        </div>
                        <div class="modal-full-text">
                            <h3>Full Text</h3>
                            <p>${doc.fullText}</p>
                        </div>
                        <div class="modal-tags">
                            <h3>Tags</h3>
                            ${doc.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <div class="modal-actions">
                            <a href="${doc.link}" target="_blank" class="btn">View Official Document</a>
                        </div>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);

            // Close modal event
            modal.querySelector('.close-modal').addEventListener('click', () => {
                document.body.removeChild(modal);
            });

            // Close on click outside
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                }
            });
        }

        // Filter and search functions
        function filterDocuments() {
            const searchTerm = document.getElementById('legal-search').value.toLowerCase();
            const typeFilter = document.getElementById('type-filter').value;
            const yearFilter = document.getElementById('year-filter').value;
            const topicFilter = document.getElementById('topic-filter').value;

            const filtered = legalDocuments.filter(doc => {
                const matchesSearch = doc.title.toLowerCase().includes(searchTerm) ||
                    doc.summary.toLowerCase().includes(searchTerm) ||
                    doc.tags.some(tag => tag.toLowerCase().includes(searchTerm));
                const matchesType = !typeFilter || doc.type === typeFilter;
                const matchesYear = !yearFilter || doc.year.toString() === yearFilter;
                const matchesTopic = !topicFilter || doc.topic === topicFilter;

                return matchesSearch && matchesType && matchesYear && matchesTopic;
            });

            renderLegalDocuments(filtered);
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function () {
            // Render initial documents
            renderLegalDocuments(legalDocuments);

            // Add event listeners
            document.getElementById('legal-search').addEventListener('input', filterDocuments);
            document.getElementById('type-filter').addEventListener('change', filterDocuments);
            document.getElementById('year-filter').addEventListener('change', filterDocuments);
            document.getElementById('topic-filter').addEventListener('change', filterDocuments);
        });


    </script>
