<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Library - Palestine</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- Navigation -->
    <header id="nav-container"></header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Legal Library</h1>
                <p>Explore key legal documents, resolutions, and opinions related to Palestine and the
                    Israeli-Palestinian conflict.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="legal-filters-search">
                    <div class="search-container">
                        <label for="legal-search" class="sr-only">Search legal documents</label>
                        <input type="text" id="legal-search" placeholder="Search by title or summary..."
                            aria-label="Search legal documents">
                    </div>
                    <div class="filters-container">
                        <div class="filter-group">
                            <label for="type-filter" class="sr-only">Filter by Type</label>
                            <select id="type-filter" aria-label="Filter legal documents by type">
                                <option value="">All Types</option>
                                <option value="UN">UN Resolutions</option>
                                <option value="ICJ">ICJ Opinions</option>
                                <option value="ICC">ICC Decisions</option>
                                <option value="Treaty">Treaties</option>
                                <option value="Court">Court Cases</option>
                                <option value="Report">Reports</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="year-filter" class="sr-only">Filter by Year</label>
                            <select id="year-filter" aria-label="Filter legal documents by year">
                                <option value="">All Years</option>
                                <option value="2024">2024</option>
                                <option value="2023">2023</option>
                                <option value="2022">2022</option>
                                <option value="2021">2021</option>
                                <option value="2020">2020</option>
                                <option value="2019">2019</option>
                                <option value="2018">2018</option>
                                <option value="2017">2017</option>
                                <option value="2016">2016</option>
                                <option value="2015">2015</option>
                                <option value="2014">2014</option>
                                <option value="2010">2010</option>
                                <option value="2008">2008</option>
                                <option value="2004">2004</option>
                                <option value="2002">2002</option>
                                <option value="1993">1993</option>
                                <option value="1988">1988</option>
                                <option value="1970">1970</option>
                                <option value="1967">1967</option>
                                <option value="1949">1949</option>
                                <option value="1948">1948</option>
                                <option value="1947">1947</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="topic-filter" class="sr-only">Filter by Topic</label>
                            <select id="topic-filter" aria-label="Filter legal documents by topic">
                                <option value="">All Topics</option>
                                <option value="occupation">Occupation</option>
                                <option value="apartheid">Apartheid</option>
                                <option value="war-crimes">War Crimes</option>
                                <option value="genocide">Genocide</option>
                                <option value="settlements">Settlements</option>
                                <option value="refugees">Refugees</option>
                                <option value="human-rights">Human Rights</option>
                                <option value="self-determination">Self-Determination</option>
                            </select>
                        </div>
                    </div>
                    <div class="results-info" role="status" aria-live="polite">
                        <span id="results-count">Loading documents...</span> results found.
                    </div>
                </div>

                <div class="legal-cards-container">
                    <div id="legal-documents-grid" class="grid-container">
                        <!-- Legal documents will be rendered here by JavaScript -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer id="footer-container"></footer>

    <script src="/assets/js/main.js"></script>


    <style>
        .legal-filters-search {
            margin-bottom: 2rem;
        }

        .search-container {
            margin-bottom: 1rem;
        }

        .search-container input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .filters-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .results-info {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .legal-cards-container {
            margin-top: 2rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .legal-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .legal-type {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .legal-type.un {
            background: #4a90e2;
            color: white;
        }

        .legal-type.icj {
            background: #50c878;
            color: white;
        }

        .legal-type.icc {
            background: #ff6b6b;
            color: white;
        }

        .legal-type.treaty {
            background: #9b59b6;
            color: white;
        }

        .legal-type.court {
            background: #f39c12;
            color: white;
        }

        .legal-type.report {
            background: #34495e;
            color: white;
        }

        .legal-year {
            background: #ecf0f1;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: bold;
        }

        .legal-title {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        .legal-topic {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .legal-topic.occupation {
            background: #e74c3c;
            color: white;
        }

        .legal-topic.apartheid {
            background: #8e44ad;
            color: white;
        }

        .legal-topic.war-crimes {
            background: #c0392b;
            color: white;
        }

        .legal-topic.genocide {
            background: #2c3e50;
            color: white;
        }

        .legal-topic.settlements {
            background: #d35400;
            color: white;
        }

        .legal-topic.refugees {
            background: #27ae60;
            color: white;
        }

        .legal-topic.human-rights {
            background: #2980b9;
            color: white;
        }

        .legal-topic.self-determination {
            background: #16a085;
            color: white;
        }

        .legal-topic.peace-process {
            background: #f39c12;
            color: white;
        }

        .legal-topic.statehood {
            background: #9b59b6;
            color: white;
        }

        .legal-topic.cultural-rights {
            background: #1abc9c;
            color: white;
        }

        .legal-summary {
            color: #555;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .legal-tags {
            margin-bottom: 1rem;
        }

        .legal-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background: #2c3e50;
            color: white;
            transition: background 0.3s ease;
            flex: 1;
            text-align: center;
        }

        .btn-small:hover {
            background: #1a2a3a;
        }

        .btn-small.secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .btn-small.secondary:hover {
            background: #d5dbdb;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            margin: 1rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
        }

        .modal-header h2 {
            margin: 0;
            color: #2c3e50;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #777;
        }

        .close-modal:hover {
            color: #2c3e50;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .modal-summary,
        .modal-full-text {
            margin-bottom: 1.5rem;
        }

        .modal-summary h3,
        .modal-full-text h3 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .modal-actions {
            text-align: center;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            background: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #1a2a3a;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: #777;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .filters-container {
                flex-direction: column;
            }

            .filter-group {
                min-width: 100%;
            }

            .legal-actions {
                flex-direction: column;
            }

            .btn-small {
                width: 100%;
                margin-bottom: 0.5rem;
            }
        }
    </style>
</body>

</html>
