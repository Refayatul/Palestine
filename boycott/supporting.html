<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Companies Supporting Palestine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
</head>

<body>
  <div id="common-placeholder"></div>
  
    <script>
      fetch('/assets/commons/common.html')
        .then(res => res.text())
        .then(text => {
          let oldelem = document.querySelector("div[id='common-placeholder']");
          let newelem = document.createElement("div");
          newelem.innerHTML = text;
          oldelem.parentNode.replaceChild(newelem, oldelem);
        })
    </script>
  <main class="container section">
    <h1>Companies Boycotting Israel</h1>
    <p>This is a list of companies that are actively boycotting Israel.</p>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Search…">
      <select id="sector">
        <option value="">All Sectors</option>
      </select>
      <select id="region">
        <option value="">All Regions</option>
      </select>
    </div>

    <table class="table" id="tbl">
      <thead>
        <tr>
          <th>Company</th>
          <th>Sector</th>
          <th>Region</th>
          <th>Status</th>
          <th>Sources</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p class="muted" id="lastReviewed"></p>
  </main>
  <script src="/assets/js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/assets/js/search.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/assets/js/search.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/assets/js/search.js"></script>
  <script src="/assets/js/render-boycotts.js"></script>
  <script src="/assets/js/main.js"></script>
  <div id="common-placeholder"></div>

  <script>
    fetch('/assets/commons/common.html')
      .then(res => res.text())
      .then(text => {
        let oldelem = document.querySelector("div[id='common-placeholder']");
        let newelem = document.createElement("div");
        newelem.innerHTML = text;
        oldelem.parentNode.replaceChild(newelem, oldelem);
      })
  </script>
</body>

</html>
