<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Companies Supporting Palestine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
</head>

<body>
  <!-- Navigation -->
  <header id="nav-container"></header>

  <main class="container section">
    <h1>Companies Boycotting Israel</h1>
    <p>This is a list of companies that are actively boycotting Israel.</p>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Search…">
      <select id="sector">
        <option value="">All Sectors</option>
        <option value="Technology">Technology</option>
        <option value="Retail">Retail</option>
        <option value="Food & Beverage">Food & Beverage</option>
        <option value="Automotive">Automotive</option>
        <option value="Finance">Finance</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Fashion">Fashion</option>
        <option value="Healthcare">Healthcare</option>
      </select>
      <select id="region">
        <option value="">All Regions</option>
        <option value="North America">North America</option>
        <option value="Europe">Europe</option>
        <option value="Asia">Asia</option>
        <option value="South America">South America</option>
        <option value="Africa">Africa</option>
        <option value="Oceania">Oceania</option>
      </select>
    </div>

    <table class="table" id="tbl">
      <thead>
        <tr>
          <th>Company</th>
          <th>Sector</th>
          <th>Region</th>
          <th>Status</th>
          <th>Sources</th>
        </tr>
      </thead>
      <tbody id="boycott-data">
        <!-- Data will be loaded here by JavaScript -->
      </tbody>
    </table>
    <p class="muted" id="lastReviewed">Last reviewed: <span id="review-date">Loading...</span></p>
  </main>

  <!-- Footer -->
  <footer id="footer-container"></footer>

  <script src="/assets/js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/assets/js/search.js"></script>
  <script src="/assets/js/render-boycotts.js"></script>
  <script src="/assets/js/main.js"></script>



  <style>
    .container.section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    h1 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 1rem;
    }

    p {
      text-align: center;
      color: #555;
      margin-bottom: 2rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
      align-items: center;
    }

    .toolbar input, .toolbar select {
      padding: 0.75rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }

    .toolbar input {
      flex: 1;
      min-width: 250px;
    }

    .toolbar select {
      min-width: 150px;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .table th, .table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    .table th {
      background: #2c3e50;
      color: white;
      font-weight: bold;
    }

    .table tbody tr:hover {
      background: #f8f9fa;
    }

    .table a {
      color: #2980b9;
      text-decoration: none;
    }

    .table a:hover {
      text-decoration: underline;
    }

    .status {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
    }

    .status.boycotting {
      background: #e74c3c;
      color: white;
    }

    .status.divesting {
      background: #f39c12;
      color: white;
    }

    .status.sanctioned {
      background: #8e44ad;
      color: white;
    }

    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .source-link {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      background: #ecf0f1;
      border-radius: 4px;
      font-size: 0.8rem;
      text-decoration: none;
    }

    .source-link:hover {
      background: #d5dbdb;
    }

    .muted {
      text-align: center;
      color: #7f8c8d;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .toolbar {
        flex-direction: column;
      }

      .toolbar input, .toolbar select {
        width: 100%;
      }

      .table {
        display: block;
        overflow-x: auto;
      }

      .table th, .table td {
        min-width: 120px;
      }
    }
  </style>
</body>

</html>
