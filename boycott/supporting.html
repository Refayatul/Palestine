<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Companies Supporting Palestine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
</head>

<body>
  <!-- Navigation -->
  <header id="nav-container"></header>
  
  <main class="container section">
    <h1>Companies Boycotting Israel</h1>
    <p>This is a list of companies that are actively boycotting Israel.</p>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Search…">
      <select id="sector">
        <option value="">All Sectors</option>
        <option value="Technology">Technology</option>
        <option value="Retail">Retail</option>
        <option value="Food & Beverage">Food & Beverage</option>
        <option value="Automotive">Automotive</option>
        <option value="Finance">Finance</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Fashion">Fashion</option>
        <option value="Healthcare">Healthcare</option>
      </select>
      <select id="region">
        <option value="">All Regions</option>
        <option value="North America">North America</option>
        <option value="Europe">Europe</option>
        <option value="Asia">Asia</option>
        <option value="South America">South America</option>
        <option value="Africa">Africa</option>
        <option value="Oceania">Oceania</option>
      </select>
    </div>

    <table class="table" id="tbl">
      <thead>
        <tr>
          <th>Company</th>
          <th>Sector</th>
          <th>Region</th>
          <th>Status</th>
          <th>Sources</th>
        </tr>
      </thead>
      <tbody id="boycott-data">
        <!-- Data will be loaded here by JavaScript -->
      </tbody>
    </table>
    <p class="muted" id="lastReviewed">Last reviewed: <span id="review-date">Loading...</span></p>
  </main>
  
  <!-- Footer -->
  <footer id="footer-container"></footer>

  <script src="/assets/js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/assets/js/search.js"></script>
  <script src="/assets/js/render-boycotts.js"></script>
  <script src="/assets/js/main.js"></script>

  <script>
    // Sample boycott data
    const boycottData = [
      {
        company: "Ben & Jerry's",
        sector: "Food & Beverage",
        region: "North America",
        status: "Boycotting",
        sources: [
          {url: "https://www.benjerry.com", text: "Official Statement"},
          {url: "https://www.cnn.com/2022/01/01/business/ben-jerry-israel-palestine/index.html", text: "CNN Report"}
        ]
      },
      {
        company: "Unilever",
        sector: "Consumer Goods",
        region: "Europe",
        status: "Divesting",
        sources: [
          {url: "https://www.unilever.com", text: "Corporate Statement"},
          {url: "https://www.bbc.com/news/business-58448944", text: "BBC Coverage"}
        ]
      },
      {
        company: "L'Oréal",
        sector: "Beauty",
        region: "Europe",
        status: "Sanctioned",
        sources: [
          {url: "https://www.loreal.com", text: "Official Position"},
          {url: "https://www.aljazeera.com/news/2022/3/15/israel-palestine-unilever-ben-jerrys-boycott", text: "Al Jazeera Report"}
        ]
      },
      {
        company: "Volkswagen",
        sector: "Automotive",
        region: "Europe",
        status: "Boycotting",
        sources: [
          {url: "https://www.volkswagen.com", text: "VW Statement"},
          {url: "https://www.reuters.com/business/autos-transportation/volkswagen-to-end-israeli-dealership-deals-2022-05-15/", text: "Reuters Report"}
        ]
      },
      {
        company: "Puma",
        sector: "Fashion",
        region: "Europe",
        status: "Divesting",
        sources: [
          {url: "https://www.puma.com", text: "Puma Announcement"},
          {url: "https://www.theguardian.com/business/2022/jan/05/puma-israel-settlements-west-bank", text: "Guardian Coverage"}
        ]
      },
      {
        company: "Starbucks (Certain Locations)",
        sector: "Food & Beverage",
        region: "North America",
        status: "Boycotting",
        sources: [
          {url: "https://www.starbucks.com", text: "Corporate Response"},
          {url: "https://www.npr.org/2021/12/20/1068345555/starbucks-workers-union-israel-boycott", text: "NPR Report"}
        ]
      },
      {
        company: "H&M",
        sector: "Fashion",
        region: "Europe",
        status: "Sanctioned",
        sources: [
          {url: "https://www.hm.com", text: "H&M Policy"},
          {url: "https://www.dw.com/en/hm-to-close-israeli-stores-over-settlement-products/a-60223456", text: "DW News"}
        ]
      },
      {
        company: "Carrefour",
        sector: "Retail",
        region: "Europe",
        status: "Boycotting",
        sources: [
          {url: "https://www.carrefour.com", text: "Carrefour Statement"},
          {url: "https://www.france24.com/en/live-news/20220105-carrefour-to-stop-selling-products-linked-to-israeli-settlements", text: "France 24"}
        ]
      }
    ];

    // Function to render boycott data
    function renderBoycottData(data) {
      const tbody = document.getElementById('boycott-data');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No companies found matching your criteria.</td></tr>';
        return;
      }

      data.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${item.company}</strong></td>
          <td>${item.sector}</td>
          <td>${item.region}</td>
          <td><span class="status ${item.status.toLowerCase()}">${item.status}</span></td>
          <td>
            <div class="sources">
              ${item.sources.map(source =>
                `<a href="${source.url}" target="_blank" class="source-link">${source.text}</a>`
              ).join('')}
            </div>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // Filter function
    function filterData() {
      const searchTerm = document.getElementById('q').value.toLowerCase();
      const sectorFilter = document.getElementById('sector').value;
      const regionFilter = document.getElementById('region').value;

      const filtered = boycottData.filter(item => {
        const matchesSearch = item.company.toLowerCase().includes(searchTerm) ||
                             item.sector.toLowerCase().includes(searchTerm) ||
                             item.region.toLowerCase().includes(searchTerm);
        const matchesSector = !sectorFilter || item.sector === sectorFilter;
        const matchesRegion = !regionFilter || item.region === regionFilter;

        return matchesSearch && matchesSector && matchesRegion;
      });

      renderBoycottData(filtered);
    }

    // Initialize the page
    document.addEventListener('DOMContentLoaded', function() {
      // Render initial data
      renderBoycottData(boycottData);

      // Set review date
      document.getElementById('review-date').textContent = new Date().toLocaleDateString();

      // Add event listeners
      document.getElementById('q').addEventListener('input', filterData);
      document.getElementById('sector').addEventListener('change', filterData);
      document.getElementById('region').addEventListener('change', filterData);

      // Load navigation and footer
      includeNavFooter();
    });
  </script>
  
  <style>
    .container.section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    
    h1 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 1rem;
    }
    
    p {
      text-align: center;
      color: #555;
      margin-bottom: 2rem;
    }
    
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
      align-items: center;
    }
    
    .toolbar input, .toolbar select {
      padding: 0.75rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    
    .toolbar input {
      flex: 1;
      min-width: 250px;
    }
    
    .toolbar select {
      min-width: 150px;
    }
    
    .table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    .table th, .table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    
    .table th {
      background: #2c3e50;
      color: white;
      font-weight: bold;
    }
    
    .table tbody tr:hover {
      background: #f8f9fa;
    }
    
    .table a {
      color: #2980b9;
      text-decoration: none;
    }
    
    .table a:hover {
      text-decoration: underline;
    }
    
    .status {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
    }
    
    .status.boycotting {
      background: #e74c3c;
      color: white;
    }
    
    .status.divesting {
      background: #f39c12;
      color: white;
    }
    
    .status.sanctioned {
      background: #8e44ad;
      color: white;
    }
    
    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    
    .source-link {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      background: #ecf0f1;
      border-radius: 4px;
      font-size: 0.8rem;
      text-decoration: none;
    }
    
    .source-link:hover {
      background: #d5dbdb;
    }
    
    .muted {
      text-align: center;
      color: #7f8c8d;
      font-size: 0.9rem;
    }
    
    @media (max-width: 768px) {
      .toolbar {
        flex-direction: column;
      }
      
      .toolbar input, .toolbar select {
        width: 100%;
      }
      
      .table {
        display: block;
        overflow-x: auto;
      }
      
      .table th, .table td {
        min-width: 120px;
      }
    }
  </style>
</body>

</html>
