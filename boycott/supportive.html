    // Function to render organizations data
    function renderOrganizations(data) {
      const tbody = document.getElementById('organizations-data');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No organizations found matching your criteria.</td></tr>';
        return;
      }

      data.forEach(org => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${org.organization}</strong></td>
          <td>${org.sector}</td>
          <td>${org.region}</td>
          <td><span class="status ${org.status.toLowerCase()}">${org.status}</span></td>
          <td>
            <div class="sources">
              ${org.sources.map(source =>
          `<a href="${source.url}" target="_blank" class="source-link">${source.text}</a>`
        ).join('')}
            </div>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // Filter function
    function filterData() {
      const searchTerm = document.getElementById('q').value.toLowerCase();
      const sectorFilter = document.getElementById('sector').value;
      const regionFilter = document.getElementById('region').value;

      const filtered = organizationsData.filter(org => {
        const matchesSearch = org.organization.toLowerCase().includes(searchTerm) ||
          org.sector.toLowerCase().includes(searchTerm) ||
          org.region.toLowerCase().includes(searchTerm);
        const matchesSector = !sectorFilter || org.sector === sectorFilter;
        const matchesRegion = !regionFilter || org.region === regionFilter;

        return matchesSearch && matchesSector && matchesRegion;
      });

      renderOrganizations(filtered);
    }

    // Initialize the page
    document.addEventListener('DOMContentLoaded', function () {
      // Render initial data
      renderOrganizations(organizationsData);

      // Set review date
      document.getElementById('lastReviewed').innerHTML = 'Last reviewed: <span id="review-date">' + new Date().toLocaleDateString() + '</span>';

      // Add event listeners
      document.getElementById('q').addEventListener('input', filterData);
      document.getElementById('sector').addEventListener('change', filterData);
      document.getElementById('region').addEventListener('change', filterData);

      // Load navigation and footer
      includeNavFooter();
    });
