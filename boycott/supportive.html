<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Organizations Supporting Palestine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
</head>

<body>
  <!-- Navigation -->
  <header id="nav-container"></header>

  <main class="container section">
    <h1>Organizations Supportive of Palestine</h1>
    <p>This is a list of organizations that are supportive of Palestine.</p>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Search…">
      <select id="sector">
        <option value="">All Sectors</option>
        <option value="Human Rights">Human Rights</option>
        <option value="Academic">Academic</option>
        <option value="Religious">Religious</option>
        <option value="Legal">Legal</option>
        <option value="Cultural">Cultural</option>
        <option value="Political">Political</option>
        <option value="Medical">Medical</option>
        <option value="Environmental">Environmental</option>
      </select>
      <select id="region">
        <option value="">All Regions</option>
        <option value="Global">Global</option>
        <option value="North America">North America</option>
        <option value="Europe">Europe</option>
        <option value="Middle East">Middle East</option>
        <option value="Asia">Asia</option>
        <option value="South America">South America</option>
        <option value="Africa">Africa</option>
        <option value="Oceania">Oceania</option>
      </select>
    </div>

    <table class="table" id="tbl">
      <thead>
        <tr>
          <th>Organization</th>
          <th>Sector</th>
          <th>Region</th>
          <th>Status</th>
          <th>Sources</th>
        </tr>
      </thead>
      <tbody id="organizations-data">
        <!-- Data will be loaded here -->
      </tbody>
    </table>
    <p class="muted" id="lastReviewed"></p>
  </main>

  <!-- Footer -->
  <footer id="footer-container"></footer>

  <script src="/assets/js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/assets/js/search.js"></script>
  <script src="/assets/js/render-boycotts.js"></script>
  <script src="/assets/js/main.js"></script>



  <style>
    .container.section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    h1 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 1rem;
    }

    p {
      text-align: center;
      color: #555;
      margin-bottom: 2rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
      align-items: center;
    }

    .toolbar input,
    .toolbar select {
      padding: 0.75rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }

    .toolbar input {
      flex: 1;
      min-width: 250px;
    }

    .toolbar select {
      min-width: 150px;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .table th,
    .table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    .table th {
      background: #2c3e50;
      color: white;
      font-weight: bold;
    }

    .table tbody tr:hover {
      background: #f8f9fa;
    }

    .table a {
      color: #2980b9;
      text-decoration: none;
    }

    .table a:hover {
      text-decoration: underline;
    }

    .status {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
    }

    .status.active {
      background: #27ae60;
      color: white;
    }

    .status.supporting {
      background: #3498db;
      color: white;
    }

    .status.advocating {
      background: #9b59b6;
      color: white;
    }

    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .source-link {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      background: #ecf0f1;
      border-radius: 4px;
      font-size: 0.8rem;
      text-decoration: none;
    }

    .source-link:hover {
      background: #d5dbdb;
    }

    .muted {
      text-align: center;
      color: #7f8c8d;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .toolbar {
        flex-direction: column;
      }

      .toolbar input,
      .toolbar select {
        width: 100%;
      }

      .table {
        display: block;
        overflow-x: auto;
      }

      .table th,
      .table td {
        min-width: 120px;
      }
    }
  </style>
</body>

</html>
